    - A solid 2px border in the accent colour

    - No border-radius (square = pixel grid)
  */
  .card {

    border-radius: 0;

    box-shadow:

    display: flex;
    flex-direction: column;
    position: relative;
  }

  .card::after {
    font-family: monospace;
    font-size: 0.6rem;
    position: absolute;
    line-height: 1;
    opacity: 0.45;
    pointer-events: none;

    left: 3px;

    right: 3px;

    border-top: 1px dashed #1a1a28;
    font-size: 0.68rem;
    color: #6a6a82;
    line-height: 1.8;
  }
</style>

// ---- Escape HTML ----
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// ---- Render tabs ----
function renderTabs() {
  const $tabs = document.getElementById("tabs");
  let html = `<button class="tab" data-cat="all" style="background:#d0d0e0;border-color:#d0d0e0;color:#08080f;">All</button>`;
  for (const [k, v] of Object.entries(CATS)) {
    html += `<button class="tab" data-cat="${k}" style="border-color:${v.color}55;color:${v.color}cc">${esc(v.label)}</button>`;
  }
  $tabs.innerHTML = html;
  $tabs.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      currentFilter = btn.dataset.cat;
      updateTabs();
      renderGrid();
    });
  });
}

function updateTabs() {
  document.querySelectorAll(".tab").forEach(btn => {
    const k = btn.dataset.cat;
    if (k === currentFilter) {
      if (k === "all") {
        btn.style.background = "#d0d0e0";
        btn.style.borderColor = "#d0d0e0";
        btn.style.color = "#08080f";
      } else {
        btn.style.background = CATS[k].color;
        btn.style.borderColor = CATS[k].color;
        btn.style.color = "#08080f";
      }
    } else {
      if (k === "all") {
        btn.style.background = "transparent";
        btn.style.borderColor = "#2a2a3a";
        btn.style.color = "#6a6a82";
      } else {
        btn.style.background = "transparent";
        btn.style.borderColor = CATS[k].color + "55";
        btn.style.color = CATS[k].color + "cc";
      }
    }
  });
}

// ---- Render grid ----
function renderGrid() {
  const filtered = currentFilter === "all" ? TRAPS : TRAPS.filter(t => t.cat === currentFilter);
  const $count = document.getElementById("count");
  let countHtml = `${filtered.length} ${filtered.length === 1 ? "trap" : "traps"}`;
  if (currentFilter !== "all") {
    countHtml += `<span style="color:${CATS[currentFilter].color}">\u2014 ${esc(CATS[currentFilter].desc)}</span>`;
  }
  $count.innerHTML = countHtml;

  const $grid = document.getElementById("grid");
  let html = "";
  filtered.forEach((trap, i) => {
    const c = CATS[trap.cat];
    html += `
      <div class="card" data-idx="${TRAPS.indexOf(trap)}" style="border-color:${c.color};color:${c.color};">
        <span class="pill" style="background:${c.color}14;color:${c.color};border-color:${c.color}55;">${esc(c.label)}</span>
        <h3 class="card-title" style="color:#f0f0f8;">${esc(trap.title)}</h3>
        <p class="card-desc">${esc(trap.desc)}</p>
        <div class="card-cta" style="color:${c.color}bb;">
          <span>[ What to do ]</span>
          <span>\u2192</span>
        </div>
      </div>`;
  });
  $grid.innerHTML = html;

  $grid.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
      openModal(TRAPS[parseInt(card.dataset.idx)]);
    });
    card.addEventListener("mouseenter", () => {
      const c = CATS[TRAPS[parseInt(card.dataset.idx)].cat].color;
      card.style.boxShadow = `0 0 18px ${c}30, inset 2px 2px 0 rgba(255,255,255,0.04), inset -2px -2px 0 rgba(0,0,0,0.4)`;
    });
    card.addEventListener("mouseleave", () => {
      card.style.boxShadow = `inset 2px 2px 0 rgba(255,255,255,0.04), inset -2px -2px 0 rgba(0,0,0,0.4)`;
    });
  });
}

// ---- Modal ----
function openModal(trap) {
  const c = CATS[trap.cat];
  const $overlay = document.getElementById("overlay");
  const $modal = document.getElementById("modal");

  let refsHtml = "";
  trap.refs.forEach(r => {
    refsHtml += `
      <a class="ref" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">
        <div class="ref-tag" style="color:${c.color};">${esc(r.label)} \u2197</div>
        <div class="ref-detail">${esc(r.detail)}</div>
      </a>`;
  });

  $modal.style.borderColor = c.color;
  $modal.style.boxShadow = `inset 2px 2px 0 rgba(255,255,255,0.04), inset -2px -2px 0 rgba(0,0,0,0.5), 0 0 60px ${c.color}18`;
  $modal.innerHTML = `
    <button class="modal-close" id="modal-close">\u2715</button>
    <span class="pill" style="background:${c.color}14;color:${c.color};border-color:${c.color}55;margin-bottom:0.85rem;">${esc(c.label)}</span>
    <h2 class="modal-title">${esc(trap.title)}</h2>
    <p class="modal-desc">${esc(trap.desc)}</p>
    <div class="todo" style="border-color:${c.color}70;">
      <div class="todo-label" style="color:${c.color};">// What to do \u2193</div>
      <p>${esc(trap.todo)}</p>
    </div>
    <div class="refs-label">// Read more</div>
    ${refsHtml}
  `;

  $overlay.classList.remove("hidden");
  document.body.style.overflow = "hidden";

  document.getElementById("modal-close").addEventListener("click", closeModal);
}

function closeModal() {
  document.getElementById("overlay").classList.add("hidden");
  document.body.style.overflow = "";
}

document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) closeModal();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

// ---- Init ----
renderTabs();
renderGrid();
</script>

</body>
</html>
